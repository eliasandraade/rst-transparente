name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Tipos · Testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Migrations · Integração (PostgreSQL + Redis reais) · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Banco descartável do CI, só na rede do job: autenticação trust, sem senha.
          POSTGRES_USER: cond
          POSTGRES_DB: cond_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cond -d cond_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://cond@localhost:5432/cond_test
      SHADOW_DATABASE_URL: postgresql://cond@localhost:5432/cond_shadow
      REDIS_URL: redis://localhost:6379
      CLIENT_IP_HEADER: x-real-ip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Banco de sombra para conferir schema × migrations
        run: psql -h localhost -U cond -d cond_test -c "CREATE DATABASE cond_shadow"
      - name: schema.prisma e migrations em sincronia
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Migrations num banco limpo
        run: npx prisma migrate deploy
      - name: Instalação existente (0_init com dados) recebe as organizações sem perda
        env:
          LEGACY: postgresql://cond@localhost:5432/cond_legacy
        run: |
          psql -h localhost -U cond -d cond_test -c "CREATE DATABASE cond_legacy"
          psql -v ON_ERROR_STOP=1 -h localhost -U cond -d cond_legacy -f prisma/migrations/0_init/migration.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U cond -d cond_legacy -f tests/fixtures/legacy-install.sql
          DATABASE_URL="$LEGACY" npx prisma migrate resolve --applied 0_init
          DATABASE_URL="$LEGACY" node scripts/db-migrate.mjs
          q() { psql -h localhost -U cond -d cond_legacy -Atc "$1"; }
          test "$(q "select slug || '|' || \"protocolPrefix\" from organizations")" = "santissima-trindade|RST"
          for t in users config_portal categorias lancamentos demands demand_updates enquetes opcoes_enquete votos_enquete processos; do
            test "$(q "select count(*) from $t where \"organizationId\" is distinct from '8f282e77-cb75-4d75-99fd-9ac01057227c'")" = "0" || { echo "$t sem organização"; exit 1; }
          done
          test "$(q "select valor from lancamentos where id = 'legacy-l1'")" = "1234.56"
          test "$(q "select protocol from demands where id = 'legacy-d1'")" = "RST-2026-K7M9Q2"
          test "$(q "select count(*) from pg_class where relrowsecurity and relforcerowsecurity and relnamespace = 'public'::regnamespace")" = "21"
      - name: Banco novo nasce sem organização
        run: test "$(psql -h localhost -U cond -d cond_test -Atc "select count(*) from organizations")" = "0"
      - name: Banco com divergência é recusado sem nada marcado
        env:
          DRIFTED: postgresql://cond@localhost:5432/cond_drifted
        run: |
          psql -h localhost -U cond -d cond_test -c "CREATE DATABASE cond_drifted"
          DATABASE_URL="$DRIFTED" npx prisma db push --skip-generate
          psql -h localhost -U cond -d cond_drifted -c 'ALTER TABLE users ADD COLUMN "fora_do_schema" text'
          if DATABASE_URL="$DRIFTED" node scripts/db-migrate.mjs; then echo "deveria ter recusado"; exit 1; fi
          test "$(psql -h localhost -U cond -d cond_drifted -Atc "select to_regclass('public._prisma_migrations') is null")" = "t"
      - name: Integração (dono das tabelas)
        run: npm run test:integration
      - name: Papel de runtime sem BYPASSRLS
        run: psql -v ON_ERROR_STOP=1 -h localhost -U cond -d cond_test -f scripts/db-runtime-role.sql
      - name: Integração com RLS valendo (rotas pelo papel cond_app)
        env:
          DATABASE_URL: postgresql://cond_app@localhost:5432/cond_test
          ADMIN_DATABASE_URL: postgresql://cond@localhost:5432/cond_test
        run: npm run test:integration
      - run: npm run build
      - name: Servidor de produção de pé (middleware Edge, rotas por condomínio, saúde)
        env:
          LEGACY_HOST_ORGANIZATION: legado.test=condominio-smoke
        run: |
          psql -h localhost -U cond -d cond_test -c "INSERT INTO organizations (id, slug, name, \"shortName\", \"protocolPrefix\", \"updatedAt\") VALUES (gen_random_uuid(), 'condominio-smoke', 'Condomínio Smoke', 'Smoke', 'SMK', now())"
          npm run start -- -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/health >/dev/null && break; sleep 1; done
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "${@:3}" "http://localhost:3100$1"); echo "$1 -> $code (esperado $2)"; [ "$code" = "$2" ] || { tail -50 /tmp/next.log; exit 1; }; }
          location() { curl -s -o /dev/null -w "%{redirect_url}" "${@:2}" "http://localhost:3100$1"; }
          check /api/health 200
          check / 200
          check /condominio-smoke 200
          check /condominio-smoke/financeiro 200
          check /condominio-smoke/admin/login 200
          check /condominio-smoke/admin/dashboard 307
          case "$(location /condominio-smoke/admin/dashboard)" in */condominio-smoke/admin/login\?callbackUrl=%2Fadmin%2Fdashboard) ;; *) echo "login fora do condomínio"; exit 1;; esac
          check /condominio-inexistente 404
          check /condominio-inexistente/admin/login 404
          check /admin/login 404
          check /financeiro 308 -H "Host: legado.test"
          case "$(location /demandas/acompanhar/SMK-2026-AAAAAA -H "Host: legado.test")" in */condominio-smoke/demandas/acompanhar/SMK-2026-AAAAAA) ;; *) echo "redirecionamento legado errado"; exit 1;; esac
          check /financeiro 404
          # Orken ID não configurado: a entrada volta ao login do condomínio
          case "$(location /entrar/condominio-smoke)" in */condominio-smoke/admin/login\?orken=desligado) ;; *) echo "entrada sem Orken ID errada"; exit 1;; esac
          # Escrita de outra origem
          check /condominio-smoke/api/demandas 403 -X POST -H "Origin: https://outro.test" -H "content-type: application/json" -d "{}"
          # Login local com conta sintética desta execução: sessão no servidor, cookie __Host- HttpOnly
          SMOKE_PASSWORD=$(openssl rand -hex 16)
          HASH=$(node -e "console.log(require('bcryptjs').hashSync(process.argv[1], 10))" "$SMOKE_PASSWORD")
          psql -h localhost -U cond -d cond_test -c "INSERT INTO users (id, \"organizationId\", email, name, password, role, \"updatedAt\") SELECT 'smoke-user', id, 'smoke@condominio-smoke.test', 'Smoke', '$HASH', 'GESTAO', now() FROM organizations WHERE slug = 'condominio-smoke'"
          curl -s -D /tmp/login.headers -o /dev/null -X POST -H "Origin: http://localhost:3100" -H "content-type: application/json" \
            -d "{\"email\":\"smoke@condominio-smoke.test\",\"password\":\"$SMOKE_PASSWORD\"}" http://localhost:3100/condominio-smoke/api/auth/login
          grep -q "^HTTP/1.1 200" /tmp/login.headers
          grep -i "set-cookie: __Host-cond_session=" /tmp/login.headers | grep -qi "httponly"
          SESSION=$(grep -io "__Host-cond_session=[^;]*" /tmp/login.headers | head -1)
          check /condominio-smoke/admin/dashboard 200 -H "Cookie: $SESSION; $(grep -io "__Host-cond_csrf=[^;]*" /tmp/login.headers | head -1)"
          # Logout: sessão revogada e cookies expirados com os mesmos atributos (__Host- exige Secure)
          CSRF=$(grep -io "__Host-cond_csrf=[^;]*" /tmp/login.headers | head -1)
          curl -s -D /tmp/logout.headers -o /dev/null -X POST -H "Origin: http://localhost:3100" -H "x-cond-csrf: ${CSRF#*=}" -H "Cookie: $SESSION; $CSRF" http://localhost:3100/condominio-smoke/api/auth/logout
          grep -i "set-cookie: __Host-cond_session=;" /tmp/logout.headers | grep -i "max-age=0" | grep -qi "secure"
          check /condominio-smoke/admin/dashboard 307 -H "Cookie: $SESSION; $CSRF"
          WRONG=$(openssl rand -hex 16)
          check /condominio-smoke/api/auth/login 401 -X POST -H "Origin: http://localhost:3100" -H "content-type: application/json" -d "{\"email\":\"smoke@condominio-smoke.test\",\"password\":\"$WRONG\"}"
          if grep -E "TypeError|Error:" /tmp/next.log; then echo "erro no log do servidor"; exit 1; fi
